name: Build simulatore.js

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# CONCESSONE ESPLICITA: permette a GitHub Actions di scrivere (push) nel repository
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
        working-directory: ./simulator
      
      - name: Bundle simulatore.js
        run: npm run bundle
        working-directory: ./simulator
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simulator/dist/simulatore.js
          # Esegue il commit solo se il file è effettivamente cambiato
          git diff --staged --quiet || git commit -m "Build: aggiorna simulatore.js [skip ci]"
          git push
