name: Build simulatore.js

on:
  # Si attiva ad ogni push
  push:
    branches: [ main ]
  # Opzionale: permette anche di lanciarlo manualmente dalla tab "Actions"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Necessario per poter committare il file aggiornato
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
        working-directory: ./simulator
      
      - name: Bundle simulatore.js
        run: npm run bundle
        working-directory: ./simulator
      
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simulator/dist/simulatore.js
          # Committa solo se ci sono modifiche effettive
          git diff --staged --quiet || git commit -m "Build: aggiorna simulatore.js"
          git push
